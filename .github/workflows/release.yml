name: Release

# Stages an npm release and creates a GitHub Release when a version tag is pushed:
#   npm version minor && git push --follow-tags
# The version only becomes installable after a maintainer approves it with 2FA
# (npm stage approve, or npmjs.com → discordctl → Staged Packages).
# Tags with a pre-release suffix (v0.2.0-beta.1) publish under the npm "next" dist-tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Staged publishing needs npm >= 11.15.0.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          case "$version" in *-*) echo "DIST_TAG=next" >> "$GITHUB_ENV"; echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; *) echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;; esac

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Pack
        run: npm pack

      - name: Smoke-test the packed package
        run: |
          prefix=$(mktemp -d)
          npm install -g --prefix "$prefix" ./discordctl-*.tgz
          cd "$(mktemp -d)"
          "$prefix/bin/discordctl" --version
          "$prefix/bin/discordctl" init --template gaming-community --guild 123456789012345678 --output g.yaml
          "$prefix/bin/discordctl" validate --strict --config g.yaml --state ./state.db

      # Authenticates with npm trusted publishing (OIDC, no stored secret). The trusted publisher
      # only allows staging, so nothing ships without a maintainer's 2FA approval.
      - name: Stage npm release
        run: npm stage publish ./discordctl-*.tgz --tag "$DIST_TAG" --access public

      - name: Approval instructions
        run: |
          {
            echo "### npm release staged: ${GITHUB_REF_NAME}"
            echo ""
            echo "It is **not installable yet**. Approve it with 2FA:"
            echo ""
            echo '- npmjs.com → discordctl → **Staged Packages** → **Approve**, or'
            echo '- `npm stage list discordctl` then `npm stage approve <stage-id>`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./discordctl-*.tgz --verify-tag --generate-notes $PRERELEASE
