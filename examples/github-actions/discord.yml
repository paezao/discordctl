# Manage a Discord server from a Git repository with discordctl.
#
#   Pull request that changes discord.yaml → offline validation, permission audit and access matrix,
#                                            commented on the PR (no bot token is available to PRs).
#   Merge to main                          → plan, wait for approval in the "discord" environment,
#                                            then apply exactly the approved plan.
#
# Setup (see docs/ci-cd.md):
#   1. Copy this file to .github/workflows/discord.yml in the repository holding discord.yaml.
#   2. Create two environments (Settings → Environments), both with deployment branches limited to main:
#        discord-plan: no reviewers                     (read the server to plan)
#        discord:      required reviewers, prevent self-review (apply)
#   3. Add the secret DISCORD_TOKEN to BOTH environments. Never as a repository secret: pull requests can
#      run modified copies of this workflow, and environments limited to main keep the token away from them.
#   4. Settings → Variables → Actions → repository variable DISCORD_GUILD_ID.
name: Discord

on:
  pull_request:
    paths: ["discord.yaml", ".github/workflows/discord.yml"]
  push:
    branches: [main]
    paths: ["discord.yaml"]
  workflow_dispatch:
    inputs:
      allow_delete:
        description: "Allow deleting resources removed from discord.yaml"
        type: boolean
        default: false

# One run at a time: plans and applies against the same server must not interleave.
concurrency:
  group: discordctl
  cancel-in-progress: false

permissions:
  contents: read

env:
  CONFIG: discord.yaml
  DISCORDCTL: npx -y discordctl@0.1
  DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
  # Refuse to touch any other guild, even if the config is edited to point elsewhere.
  DISCORDCTL_ALLOWED_GUILDS: ${{ vars.DISCORD_GUILD_ID }}
  DISCORDCTL_STATE: ${{ github.workspace }}/.discordctl/state.db
  STATE_BRANCH: discordctl-state

jobs:
  # ---------------------------------------------------------------- pull requests
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Offline only: no secrets are reachable from pull requests. The live plan is shown on the
      # merge run, before anyone approves the apply.
      - name: Validate and simulate permissions
        env:
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || '000000000000000000' }}
        run: |
          set +e
          $DISCORDCTL validate --strict --config "$CONFIG" --no-color > "$RUNNER_TEMP/validate.txt" 2>&1
          code=$?
          set -e
          $DISCORDCTL permissions --config "$CONFIG" --no-color > "$RUNNER_TEMP/matrix.txt"
          cat "$RUNNER_TEMP/validate.txt" "$RUNNER_TEMP/matrix.txt"
          echo "$code" > "$RUNNER_TEMP/validate.code"

      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### discordctl check"
            echo
            echo '```'
            head -c 30000 "$RUNNER_TEMP/validate.txt"
            echo '```'
            echo
            echo "<details><summary>Effective permissions (simulated)</summary>"
            echo
            echo '```'
            head -c 30000 "$RUNNER_TEMP/matrix.txt"
            echo '```'
            echo "</details>"
            echo
            echo "After merge, the exact changes against Discord are planned and shown on the workflow run; they are applied only after approval in the \`discord\` environment."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/comment.md" 2>/dev/null \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"

      - name: Fail on validation errors
        run: test "$(cat "$RUNNER_TEMP/validate.code")" = 0

  # ---------------------------------------------------------------- main: plan, then gated apply
  plan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Holds the token for reading the server. Limited to main, so pull requests cannot use it.
    environment: discord-plan
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore state
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            git show "origin/$STATE_BRANCH:state.json" > "$RUNNER_TEMP/state.json"
            $DISCORDCTL state restore "$RUNNER_TEMP/state.json" --replace
          fi

      - name: Plan
        id: plan
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ALLOW_DELETE: ${{ inputs.allow_delete && '--allow-delete' || '' }}
        run: |
          set +e
          $DISCORDCTL plan --config "$CONFIG" --no-color --detailed-exitcode --out plan.json $ALLOW_DELETE > plan.txt
          code=$?
          set -e
          cat plan.txt
          { echo "### discordctl plan"; echo; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        if: steps.plan.outputs.changes == 'true'
        with:
          name: plan
          path: plan.json
          retention-days: 7

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the human approval step (limited to main).
    environment: discord
    permissions:
      contents: write # push the state branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: plan

      - name: Restore state
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            git show "origin/$STATE_BRANCH:state.json" > "$RUNNER_TEMP/state.json"
            $DISCORDCTL state restore "$RUNNER_TEMP/state.json" --replace
          fi

      # Applies the exact plan that was reviewed. If the server changed since, discordctl refuses
      # (fingerprint mismatch) and the workflow must be re-run to produce a fresh plan.
      - name: Apply
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ALLOW_DELETE: ${{ inputs.allow_delete && '--allow-delete' || '' }}
        run: $DISCORDCTL apply --plan plan.json --config "$CONFIG" --yes --allow-high-risk --no-color $ALLOW_DELETE

      - name: Save state
        if: always()
        run: |
          [ -f "$DISCORDCTL_STATE" ] || exit 0
          $DISCORDCTL state export > "$RUNNER_TEMP/state.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit state.json onto the state branch without checking it out.
          git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null || true
          parent=$(git rev-parse -q --verify "refs/remotes/origin/$STATE_BRANCH" || true)
          blob=$(git hash-object -w "$RUNNER_TEMP/state.json")
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then echo "State unchanged"; exit 0; fi
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "discordctl state after ${GITHUB_SHA::7}")
          git push origin "$commit:refs/heads/$STATE_BRANCH"
